name: Windows and macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            architecture: x64
          - os: macos-14
            platform: macos
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          architecture: ${{ matrix.architecture }}
      - name: Install pinned build dependencies
        run: |
          python -m pip install --no-deps .
          python -m pip install -r packaging/windows/requirements-build.txt
      - name: Build, verify and launch the packaged application
        shell: bash
        env:
          MC7_BUILD_PLATFORM: ${{ matrix.platform }}
          QT_QPA_PLATFORM: offscreen
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          mkdir -p tmp/native
          export TMPDIR="$PWD/tmp/native" TEMP="$PWD/tmp/native" TMP="$PWD/tmp/native"
          python "scripts/build_${MC7_BUILD_PLATFORM}.py" --output-dir "dist/${MC7_BUILD_PLATFORM}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: MC7-Studio-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
