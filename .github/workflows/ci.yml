name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1
      - name: Install desktop package and test dependencies
        run: python -m pip install '.[gui]' 'tomli>=2,<3'
      - name: Run unit tests without hardware
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p tmp/ci
          export TMPDIR="$PWD/tmp/ci" TEMP="$PWD/tmp/ci" TMP="$PWD/tmp/ci"
          python -c 'import faulthandler, unittest; faulthandler.dump_traceback_later(180, exit=True); unittest.main(module=None, argv=["unittest", "discover", "-s", "tests", "-v"])'
      - name: Check installed entry point and native dependency
        run: |
          swarm2 --version
          python -c 'from swarm2.devices import load_hidapi; load_hidapi()'
